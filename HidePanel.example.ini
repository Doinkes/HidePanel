# ---------------------------------------------------------------------------
#  HidePanel: пример настроек.
#  Скопируйте в HidePanel.ini рядом с HidePanel.exe и раскомментируйте нужное.
# ---------------------------------------------------------------------------

[settings]

; Толщина «горячей» полосы у нижнего края экрана, в пикселях (1..64).
; Курсор, попавший в эту полосу, мгновенно показывает панель задач.
edge_px=2

; Период опроса курсора, мс (1..200). 5 мс — примерно 200 проверок в секунду;
; большее значение снижает нагрузку на процессор, отзывчивость почти не страдает.
poll_ms=5

; 1 — рабочая область = весь экран: развёрнутые окна занимают весь монитор,
;     панель рисуется поверх них. 0 — оставить место под панель (как раньше).
full_work_area=1

; 1 — не показывать панель поверх полноэкранных игр и видео, 0 — показывать всегда.
fullscreen_guard=1

; 1 — при выходе вернуть исходное состояние штатного авто-скрытия, 0 — оставить как есть.
restore_on_exit=1

; 1 — писать лог в %LOCALAPPDATA%\HidePanel\HidePanel.log (полезно для баг-репортов).
log=0

; Язык интерфейса: ru, en или auto (по языку системы).
language=auto

; Горячая клавиша аварийного выхода. Модификаторы: Ctrl, Alt, Shift, Win.
; Клавиша: A-Z, 0-9, F1-F24. Значение none отключает клавишу совсем.
exit_hotkey=Ctrl+Alt+Q
